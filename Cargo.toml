[package]
name = "harness-daily"
version = "0.1.1"
edition = "2021"
description = "Turn local AI coding sessions into a daily work report."
license = "MIT"
repository = "https://github.com/TardisBooo/ai-coding-daily-report"
readme = "README.md"

[[bin]]
name = "harness-daily"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dunce = "1"
glob = "0.3"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
urlencoding = "2"
which = "7"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
